spring.application.name=transfer-service
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/wallet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wallet_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wallet_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

transaction.service.base-url=${TRANSACTION_SERVICE_BASE_URL:http://localhost:8085}